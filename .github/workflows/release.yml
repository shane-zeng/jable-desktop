name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build unsigned macOS artifacts
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run quality checks
        run: npm run check

      - name: Build unsigned macOS artifacts
        run: npm run dist:mac:unsigned

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          retention-days: 1
          path: |
            release/*.dmg
            release/*.zip

  build-win:
    name: Build unsigned Windows artifacts
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run quality checks
        run: npm run check

      - name: Build unsigned Windows artifacts
        run: npm run dist:win:unsigned

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          retention-days: 1
          path: |
            release/*.exe
            release/*.zip

  release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs:
      - build-mac
      - build-win

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          artifacts=(dist/*.dmg dist/*.exe dist/*.zip)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "::error::No release artifacts found"
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" "${artifacts[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "Unsigned desktop build for $GITHUB_REF_NAME. Download and smoke test the artifacts before publishing."

      - name: Verify release bypass token
        env:
          RELEASE_BYPASS_PAT: ${{ secrets.RELEASE_BYPASS_PAT }}
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_BYPASS_PAT" ]; then
            echo "::error::Missing RELEASE_BYPASS_PAT repository secret."
            exit 1
          fi

      - name: Check out default branch for changelog update
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_BYPASS_PAT }}

      - name: Set up Node.js for changelog script
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install changelog formatter dependencies
        run: npm ci --ignore-scripts

      - name: Update changelog for released tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force --tags

          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          default_commit="$(git rev-parse HEAD)"

          if [ "$tag_commit" != "$default_commit" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME must point at the current default branch head before the changelog can be committed automatically."
            exit 1
          fi

          node scripts/update-release-changelog.js
          npm exec -- prettier --write CHANGELOG.md

      - name: Commit changelog update
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Update changelog for $RELEASE_TAG"
          git push origin "HEAD:$DEFAULT_BRANCH"
