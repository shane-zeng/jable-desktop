name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: '24'

jobs:
  build-mac:
    name: Build unsigned macOS artifacts
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test:all

      - name: Build unsigned macOS artifacts
        run: npm run dist:mac:unsigned

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip

  build-win:
    name: Build unsigned Windows artifacts
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test:all

      - name: Build unsigned Windows artifacts
        run: npm run dist:win:unsigned

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.zip

  release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs:
      - build-mac
      - build-win

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          artifacts=(dist/*.dmg dist/*.exe dist/*.zip)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "::error::No release artifacts found"
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" "${artifacts[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "Unsigned desktop build for $GITHUB_REF_NAME. Download and smoke test the artifacts before publishing."
