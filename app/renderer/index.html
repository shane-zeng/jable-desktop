<!doctype html>
<html lang="zh-Hant" data-theme="system">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self';"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jable Desktop</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-title">Jable Desktop</span>
          <span id="status" class="status">準備中</span>
        </div>
        <div class="view-switcher" role="tablist" aria-label="Main views">
          <button id="show-browser-button" class="view-tab active" type="button">瀏覽器</button>
          <button id="show-library-button" class="view-tab" type="button">本機資料</button>
        </div>
        <div class="browser-actions">
          <select id="theme-select" class="theme-select" aria-label="主題">
            <option value="system">系統</option>
            <option value="dark">深色</option>
            <option value="light">淺色</option>
          </select>
          <button id="back-button" type="button" title="上一頁">‹</button>
          <button id="reload-button" type="button" title="重新整理">↻</button>
          <button id="diagnose-button" type="button" hidden>診斷</button>
          <button id="clear-session-button" type="button" hidden>清除登入狀態</button>
        </div>
      </header>

      <main class="workspace">
        <section id="browser-view-panel" class="browser-pane view-panel active" aria-label="Jable browser">
          <div id="browser-host" class="browser-host"></div>
        </section>

        <section id="library-view-panel" class="library-pane view-panel" aria-label="Local library">
          <div class="library-header">
            <div class="tabs" role="tablist" aria-label="Collections">
              <button class="tab active" type="button" data-collection="favourites">影片收藏</button>
              <button class="tab" type="button" data-collection="watch_later">稍後觀看</button>
            </div>

            <div class="toolbar">
              <button id="sync-button" class="primary" type="button">同步目前 Jable 頁面</button>
              <button id="import-button" type="button">匯入 JSON</button>
              <button id="export-button" type="button">匯出 JSON</button>
              <button id="clear-sync-button" type="button">重置同步狀態</button>
              <input id="import-file" type="file" accept="application/json,.json" hidden>
            </div>
          </div>

          <div class="filters">
            <input id="search-input" type="search" placeholder="搜尋標題或 URL">
            <select id="sort-select" aria-label="排序">
              <option value="last_seen_at">最近同步</option>
              <option value="title">標題</option>
              <option value="views">觀看數</option>
              <option value="likes">喜歡數</option>
            </select>
            <select id="direction-select" aria-label="排序方向">
              <option value="desc">遞減</option>
              <option value="asc">遞增</option>
            </select>
          </div>

          <div class="meta">
            <span id="count-label">0 筆</span>
            <span id="db-path" title="SQLite database path"></span>
          </div>

          <div id="video-list" class="video-list"></div>

          <div class="pagination">
            <button id="prev-page-button" type="button">上一頁</button>
            <span id="page-label">第 1 / 1 頁</span>
            <button id="next-page-button" type="button">下一頁</button>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
